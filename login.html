<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            background: #1a1a1a;
            border-color: #2a2a2a;
        }

        .form-control {
            background: #0a0a0a !important;
            color: #ffffff !important;
            border-color: #2a2a2a !important;
        }

        .form-control:focus {
            border-color: #c9a84c !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 168, 76, 0.25) !important;
        }

        .btn-warning {
            background: #c9a84c;
            border: none;
            color: #0a0a0a;
        }

        .btn-warning:hover {
            background: #dbb95c;
        }

        .text-warning {
            color: #c9a84c !important;
        }

        .text-secondary {
            color: #a0a0a0 !important;
        }

        a {
            color: #c9a84c;
            text-decoration: none;
        }

        a:hover {
            color: #dbb95c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card border-secondary">
                    <div class="card-body p-4">
                        <h1 class="text-center text-warning">✨ TiendaPremium</h1>
                        <p class="text-center text-secondary">Panel de Administración</p>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="text-secondary">Correo electrónico</label>
                                <input type="email" id="email" class="form-control" required
                                    placeholder="admin@tutienda.com">
                            </div>
                            <div class="mb-3">
                                <label class="text-secondary">Contraseña</label>
                                <input type="password" id="password" class="form-control" required
                                    placeholder="Admin2024!">
                            </div>
                            <button type="submit" class="btn btn-warning w-100">🔐 Iniciar Sesión</button>
                            <div id="mensajeLogin" class="mt-3 text-center"></div>
                        </form>

                        <div class="text-center mt-3">
                            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                            <br>
                            <a href="index.html">← Volver a la tienda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.netlify.js"></script>
    <script src="js/config.local.js" onerror="console.log('ℹ️ config.local.js no encontrado')"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
