<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Route66 Market</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
    <style>
        body {
            background: var(--bg-black);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 44px 40px;
            max-width: 380px;
            width: 100%;
        }

        .login-box .brand {
            text-align: center;
            margin-bottom: 4px;
        }

        .login-box .brand .logo {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
        }

        .login-box .brand .tagline {
            font-size: 0.5rem;
            color: var(--text-silver);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: block;
        }

        .login-box .sub {
            color: var(--text-silver);
            font-size: 0.75rem;
            font-weight: 300;
            text-align: center;
            margin: 2px 0 24px;
        }

        .login-box .form-control {
            background: var(--bg-input) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border) !important;
            border-radius: 0 !important;
            padding: 12px 16px;
            font-weight: 300;
            font-size: 0.85rem;
            width: 100%;
            margin-bottom: 15px;
        }

        .login-box .form-control:focus {
            border-color: var(--text-silver) !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04) !important;
        }

        .login-box .btn-login {
            background: var(--accent);
            color: var(--bg-black);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
        }

        .login-box .btn-login:hover {
            background: var(--accent-hover);
        }

        .login-box .mensaje {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 300;
        }

        .login-box .mensaje.error {
            color: var(--regio-red);
        }

        .login-box .mensaje.success {
            color: var(--regio-green);
        }

        .login-box .links {
            text-align: center;
            margin-top: 16px;
        }

        .login-box .links a {
            color: var(--text-silver);
            text-decoration: none;
            font-weight: 300;
            font-size: 0.7rem;
            transition: color 0.3s ease;
        }

        .login-box .links a:hover {
            color: var(--text-main);
        }

        .login-box .links .sep {
            color: var(--text-dim);
            margin: 0 6px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="brand">
            <span class="logo">THE ROUTE66 MARKET</span>
            <span class="tagline">ADMIN ACCESS</span>
        </div>
        <p class="sub">Panel de Administración</p>

        <form id="loginForm">
            <div class="mb-3">
                <!-- ⚠️ Placeholder ficticio, NO usar tu correo real aquí -->
                <input type="email" id="email" class="form-control" placeholder="admin@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">🔐 Iniciar Sesión</button>
            <div id="mensajeLogin" class="mensaje"></div>
        </form>

        <div class="links">
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            <span class="sep">·</span>
            <a href="index.html">← Volver a la tienda</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.netlify.js"></script>
    <script src="js/config.local.js" onerror="console.log('ℹ️ config.local.js no encontrado')"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
