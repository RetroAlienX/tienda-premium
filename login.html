<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            background: #1a1a1a;
            border-color: #2a2a2a;
        }

        .form-control {
            background: #0a0a0a !important;
            color: #ffffff !important;
            border-color: #2a2a2a !important;
        }

        .form-control:focus {
            border-color: #c9a84c !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 168, 76, 0.25) !important;
        }

        .btn-warning {
            background: #c9a84c;
            border: none;
            color: #0a0a0a;
        }

        .btn-warning:hover {
            background: #dbb95c;
        }

        .text-warning {
            color: #c9a84c !important;
        }

        .text-secondary {
            color: #a0a0a0 !important;
        }

        a {
            color: #c9a84c;
            text-decoration: none;
        }

        a:hover {
            color: #dbb95c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card border-secondary">
                    <div class="card-body p-4">
                        <h1 class="text-center text-warning">✨ TiendaPremium</h1>
                        <p class="text-center text-secondary">Panel de Administración</p>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="text-secondary">Correo electrónico</label>
                                <input type="email" id="email" class="form-control" required
                                    placeholder="admin@tutienda.com">
                            </div>
                            <div class="mb-3">
                                <label class="text-secondary">Contraseña</label>
                                <input type="password" id="password" class="form-control" required
                                    placeholder="Admin2024!">
                            </div>
                            <button type="submit" class="btn btn-warning w-100">🔐 Iniciar Sesión</button>
                            <div id="mensajeLogin" class="mt-3 text-center"></div>
                        </form>

                        <div class="text-center mt-3">
                            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                            <br>
                            <a href="index.html">← Volver a la tienda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS - ORDEN CORRECTO                   -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración local (si existe) -->
    <script src="js/config.local.js"></script>

    <!-- Configuración principal -->
    <script src="js/config.js"></script>

    <!-- Supabase -->
    <script src="js/supabase.js"></script>

    <script>
        // ============================================
        // LOGIN - VERIFICAR QUE TODO EXISTE
        // ============================================

        // Esperar a que el DOM esté listo
        document.addEventListener('DOMContentLoaded', function () {
            console.log('✅ DOM cargado');

            // Verificar que supabase existe
            if (typeof supabase === 'undefined' || supabase === null) {
                console.error('❌ supabase no está disponible');
                document.getElementById('mensajeLogin').innerHTML =
                    '<span style="color:#dc3545;">❌ Error de conexión. Recarga la página.</span>';
                return;
            }

            console.log('✅ supabase disponible para login');

            // Verificar que el formulario existe
            const loginForm = document.getElementById('loginForm');
            if (!loginForm) {
                console.error('❌ Formulario no encontrado');
                return;
            }

            console.log('✅ Formulario encontrado');

            // Evento de login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const mensaje = document.getElementById('mensajeLogin');
                const boton = document.querySelector('button[type="submit"]');

                if (!email || !password) {
                    mensaje.innerHTML = '<span style="color:#dc3545;">❌ Completa todos los campos</span>';
                    return;
                }

                mensaje.innerHTML = '<span style="color:#a0a0a0;">⏳ Iniciando sesión...</span>';
                boton.disabled = true;
                boton.textContent = '⏳ Cargando...';

                try {
                    console.log('🔐 Intentando login con:', email);

                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        console.log('❌ Error:', error.message);
                        mensaje.innerHTML = '<span style="color:#dc3545;">❌ ' + error.message + '</span>';
                        boton.disabled = false;
                        boton.textContent = '🔐 Iniciar Sesión';
                        return;
                    }

                    console.log('✅ Login exitoso:', data.user.email);
                    mensaje.innerHTML = '<span style="color:#28a745;">✅ Redirigiendo...</span>';
                    localStorage.setItem('adminEmail', email);

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);

                } catch (error) {
                    console.log('❌ Error inesperado:', error);
                    mensaje.innerHTML = '<span style="color:#dc3545;">❌ Error inesperado</span>';
                    boton.disabled = false;
                    boton.textContent = '🔐 Iniciar Sesión';
                }
            });
        });

        console.log('✅ Login listo');
    </script>
</body>

</html>
