<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="bg-black d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card bg-dark border-secondary">
                    <div class="card-body p-4">
                        <h4 class="text-center text-warning">✨ Recuperar Contraseña</h4>
                        <p class="text-center text-secondary small">Ingresa tu correo para recibir un enlace</p>
                        <form id="recuperarForm">
                            <div class="mb-3">
                                <label class="text-secondary">Correo</label>
                                <input type="email" id="emailRecuperar"
                                    class="form-control bg-black text-white border-secondary" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">📧 Enviar</button>
                            <div id="mensajeRecuperar" class="mt-3 text-center"></div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html" class="text-secondary">← Volver al login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('recuperarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailRecuperar').value;
            const mensaje = document.getElementById('mensajeRecuperar');
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/login.html'
                });
                if (error) throw error;
                mensaje.innerHTML = '<span class="text-success">✅ Revisa tu correo</span>';
            } catch (error) {
                mensaje.innerHTML = '<span class="text-danger">❌ ' + error.message + '</span>';
            }
        });
    </script>
</body>

</html>
