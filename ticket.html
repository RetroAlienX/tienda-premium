<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket · Route66 Market</title>
    <link rel="stylesheet" href="css/custom.css">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }

            #ticket-content,
            #ticket-content * {
                visibility: visible;
            }

            #ticket-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                padding: 5mm;
                background: white;
                color: black;
            }

            @page {
                margin: 0;
                size: 80mm auto;
            }

            .no-print {
                display: none !important;
            }
        }

        .ticket-preview {
            max-width: 80mm;
            margin: 0 auto;
            padding: 5mm;
            background: white;
            color: black;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
        }

        .ticket-header {
            text-align: center;
            border-bottom: 2px dashed #000;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .ticket-header h2 {
            font-size: 14px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .ticket-header .sub {
            font-size: 9px;
            color: #666;
            letter-spacing: 2px;
            margin: 2px 0;
        }

        .ticket-header .info {
            font-size: 9px;
            color: #444;
            margin: 2px 0;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 10px;
            gap: 6px;
        }
        .ticket-item-nombre {
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
        }
        .ticket-item-detalle {
            white-space: nowrap;
            color: #333;
        }

        .ticket-total {
            font-size: 13px;
            font-weight: bold;
            text-align: right;
            border-top: 2px solid #000;
            padding-top: 8px;
            margin-top: 8px;
        }

        .ticket-footer {
            text-align: center;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 2px dashed #000;
        }

        .ticket-footer .thanks {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .ticket-footer .slogan {
            font-size: 9px;
            color: #666;
            font-style: italic;
        }

        .no-print .btn-print {
            background: var(--accent);
            color: var(--bg-black);
            border: none;
            padding: 10px 28px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .no-print .btn-print:hover {
            background: var(--accent-hover);
        }

        .no-print .btn-close-ticket {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 28px;
            font-weight: 300;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .no-print .btn-close-ticket:hover {
            border-color: var(--text-silver);
        }
    </style>
</head>

<body style="background:var(--bg-black);min-height:100vh;">

    <div class="no-print" style="padding:30px 0;text-align:center;">
        <div class="container-premium">
            <h5 style="font-weight:300;color:var(--text-main);margin-bottom:16px;">🧾 Ticket</h5>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <button onclick="window.print()" class="btn-print">🖨️ Imprimir</button>
                <button onclick="window.close()" class="btn-close-ticket">✕ Cerrar</button>
            </div>
            <button onclick="cargarEjemplo()" class="btn-close-ticket"
                style="margin-top:12px;padding:6px 20px;font-size:0.7rem;">📋 Cargar ejemplo</button>
        </div>
    </div>

    <div id="ticket-content" class="ticket-preview">
        <div id="ticketBody" style="text-align:center;color:#666;padding:40px 0;">Esperando datos...</div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/ticket.js"></script>
    <script>
        function cargarEjemplo() {
            generarTicket({
                cliente: 'María García',
                telefono: '81 2687 8080',
                direccion: 'Calle #123, Colonia Centro',
                metodo_pago: 'Efectivo',
                items: [
                    { nombre: 'Perfume Test', precio: 1000, cantidad: 1 },
                    { nombre: 'Crema Hidratante', precio: 530, cantidad: 2 }
                ],
                subtotal: 2060,
                envio: 300,
                total: 2360,
                fecha: new Date().toISOString(),
                ticket_numero: 'T-20260819-0001'
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const pedidoData = urlParams.get('pedido');

            if (pedidoData) {
                try {
                    const datos = JSON.parse(decodeURIComponent(pedidoData));
                    generarTicket(datos);
                } catch (e) {
                    document.getElementById('ticketBody').innerHTML = '<p style="color:var(--regio-red);">❌ Error al cargar el ticket</p>';
                }
            }
        });

        // Ventana SIEMPRE centrada (respaldo: algunos navegadores ignoran
        // left/top en window.open y la abren pegada a la izquierda).
        (function () {
            try {
                if (window.opener && window.moveTo && window.resizeTo && window.screen) {
                    const ancho = 400;
                    const alto = 700;
                    window.resizeTo(ancho, alto);
                    window.moveTo(
                        Math.max(0, (window.screen.availWidth - ancho) / 2),
                        Math.max(0, (window.screen.availHeight - alto) / 2)
                    );
                }
            } catch (e) { /* el navegador bloqueó moveTo/resizeTo: no pasa nada */ }
        })();
    </script>

</body>

</html>
